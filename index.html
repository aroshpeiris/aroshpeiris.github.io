<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arosh Peiris | Portfolio</title>
    <!-- Simple Icons for Tool Logos -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0f;
            color: #ffffff;
            line-height: 1.6;
            padding: 0 20px 60px;
        }

        header {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f0ff;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #88888e;
            text-transform: uppercase;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #00f0ff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.2);
        }

        /* --- SKILLS SECTION --- */
        .skills-section {
            max-width: 1000px;
            margin: 0 auto 80px;
            text-align: center;
        }

        .section-title {
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #ffffff;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        .skill-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px 15px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .skill-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00f0ff;
            transform: translateY(-5px);
        }

        .skill-badge {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }

        /* Specific Brand Colors */
        .pr { background: #9999FF; color: #00005B; }
        .ae { background: #9999FF; color: #00005B; }
        .ps { background: #31A8FF; color: #001E36; }
        .ai { background: #FF9A00; color: #330000; }
        .cc { background: #ffffff; color: #000000; }

        .skill-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #d1d1d6;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            h2 { font-size: 0.9rem; letter-spacing: 2px; }
            .skills-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="badge">Creative Studio Portfolio</div>
        <h1>Arosh Peiris</h1>
        <h2>Video Editor | Graphic Designer | Junior Marketing</h2>
        <a href="#skills" class="btn">Explore Work</a>
    </header>

    <section id="skills" class="skills-section">
        <h3 class="section-title">Tools & Software</h3>
        <div class="skills-grid">
            <div class="skill-card">
                <div class="skill-badge pr">Pr</div>
                <span class="skill-name">Premiere Pro</span>
            </div>
            <div class="skill-card">
                <div class="skill-badge ae">Ae</div>
                <span class="skill-name">After Effects</span>
            </div>
            <div class="skill-card">
                <div class="skill-badge ps">Ps</div>
                <span class="skill-name">Photoshop</span>
            </div>
            <div class="skill-card">
                <div class="skill-badge ai">Ai</div>
                <span class="skill-name">Illustrator</span>
            </div>
            <div class="skill-card">
                <div class="skill-badge cc">CC</div>
                <span class="skill-name">CapCut</span>
            </div>
        </div>
    </section>

</body>
</html>
